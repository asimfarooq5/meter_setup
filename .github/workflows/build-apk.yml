name: Build APK

on:
  push:
    branches:
      - claude/meterset-pro-app-e9q4fy
      - claude/meterset-pro-app-3q0wt6
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version info
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build Release APK
        run: flutter build apk --release --verbose

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MeterSetPro-release-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error

      - name: APK size
        run: |
          size=$(du -sh build/app/outputs/flutter-apk/app-release.apk | cut -f1)
          echo "APK size: $size"
          echo "✅ Release Build #${{ github.run_number }} complete"
