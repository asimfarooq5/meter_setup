name: Build & Release APK

on:
  push:
    branches:
      - claude/meterset-pro-app-e9q4fy
      - claude/meterset-pro-app-3q0wt6
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/meterset-release-key.jks

      - name: Create key.properties
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=meterset-release-key.jks
          EOF

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons --build-number=${{ github.run_number }}

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk MeterSetPro-v${{ github.run_number }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: MeterSet Pro – Build ${{ github.run_number }}
          body: |
            ## MeterSet Pro Release

            **Build:** #${{ github.run_number }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}

            ### Install
            1. Download `MeterSetPro-v${{ github.run_number }}.apk`
            2. Enable *Install from unknown sources* on your device
            3. Install the APK
          files: MeterSetPro-v${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
