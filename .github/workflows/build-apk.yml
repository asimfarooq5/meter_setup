name: Build & Release APK

on:
  push:
    branches:
      - claude/meterset-pro-app-3q0wt6
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons --build-number=${{ github.run_number }}

      - name: Create GitHub Release
        run: |
          gh release create "v${{ github.run_number }}" \
            "build/app/outputs/flutter-apk/app-release.apk#MeterSetPro.apk" \
            --title "MeterSet Pro – Build ${{ github.run_number }}" \
            --notes "Build #${{ github.run_number }} • ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
