name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-android:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter version info
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Build universal Release APK
        run: flutter build apk --release

      - name: Get release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "MeterSet Pro ${{ steps.version.outputs.VERSION }}"
          body: |
            ## MeterSet Pro ${{ steps.version.outputs.VERSION }}

            ### Downloads
            | File | Description |
            |------|-------------|
            | `app-release.apk` | Universal APK (works on all devices) |
            | `app-arm64-v8a-release.apk` | ARM64 (most modern phones) |
            | `app-armeabi-v7a-release.apk` | ARM32 (older phones) |
            | `app-x86_64-release.apk` | x86_64 (emulators) |

            ### Features
            - Offline meter reading editor with LCD overlay
            - AI editing via HuggingFace (free) or browser fallback
            - 6 LCD display templates
            - Edit history
            - Settings tab to configure your own API keys
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
